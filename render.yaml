services:
  - type: web
    name: quod
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @quod/web build
    startCommand: pnpm --filter @quod/web start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: QUOD_MODE
        value: frontend
      - key: QUOD_LIVE_API
        value: "0"
      - key: CAIRN_LIVE_API
        value: "0"
      - key: QUOD_BACKEND_URL
        sync: false
      - key: QUOD_GATEWAY_SECRET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
