[project]
name = "quod-worker"
version = "0.0.0"
description = "Quod ingest pipeline: PDFs -> nodes, edges, anchors in Postgres."
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "openai>=1.50",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quod-worker = "quod_worker.cli:main"
# Compatibility command for existing web deployments while they reinstall.
cairn-worker = "quod_worker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quod_worker*", "cairn_worker*"]
